<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mantar Çiftliği</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: tek ekranlık uygulama kabuğu. Üstte ince başlık şeridi; solda dikey aşama menüsü;
   sağda sahne + kontrol paneli (geniş ekranda yan yana, telefonda üst üste). Sayfa hiç kaymaz. */
:root{
  --bg:#E9ECE5; --surface:#FAFBF7; --surface2:#F0F2EC; --ink:#1E2420; --muted:#59645C; --line:#CDD3CA;
  --accent:#B4521E; --accent-ink:#FFFFFF; --accent-soft:#F3DFD2;
  --ok:#2E7A4D; --warn:#9C6610; --bad:#B0372B;
  --font-d:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-b:"Inter", "Segoe UI", system-ui, sans-serif;
  --font-m:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --rail:196px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121512; --surface:#1A1E1B; --surface2:#222723; --ink:#E6EAE3; --muted:#9AA59C; --line:#313833;
  --accent:#E57D42; --accent-ink:#1B0F07; --accent-soft:#3A2618;
  --ok:#5DC18B; --warn:#E3AB4C; --bad:#F07164; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121512; --surface:#1A1E1B; --surface2:#222723; --ink:#E6EAE3; --muted:#9AA59C; --line:#313833;
  --accent:#E57D42; --accent-ink:#1B0F07; --accent-soft:#3A2618;
  --ok:#5DC18B; --warn:#E3AB4C; --bad:#F07164; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:14px;line-height:1.4;overflow:hidden}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;margin:0}
.app{height:100%;height:100dvh;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}

/* başlık şeridi */
.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:7px;padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px))}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.stats{display:flex;align-items:center;gap:4px 14px;min-width:0}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat span{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat b{font-family:var(--font-m);font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b.neg{color:var(--bad)}
.tb{display:flex;gap:6px}
.tb button{padding:6px 10px;font-size:13px}

/* sol aşama menüsü */
.rail{grid-row:2;grid-column:1;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;padding:8px 0;padding-left:env(safe-area-inset-left, 0px)}
.st{display:grid;grid-template-columns:28px 1fr;grid-template-rows:auto auto;column-gap:9px;align-items:center;padding:8px 12px;position:relative;color:var(--muted)}
.st .num{grid-row:1/3;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--font-m);font-size:12px;font-weight:600;background:var(--surface2)}
.st .nm{font-family:var(--font-d);font-weight:700;font-size:14px;color:var(--ink);line-height:1.15}
.st .sb{font-size:11px;color:var(--muted)}
.st .kisa{display:none}
.st+.st::before{content:"";position:absolute;left:25px;top:-6px;height:12px;border-left:1.5px dashed var(--line)}
.st.done .num{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.st.done .nm{color:var(--muted)}
.st.cur{background:var(--accent-soft)}
.st.cur .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st.cur::after{content:"";position:absolute;right:0;top:6px;bottom:6px;width:3px;background:var(--accent);border-radius:2px 0 0 2px}

/* ana alan */
.main{grid-row:2;grid-column:2;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(330px,1fr);gap:10px;padding:10px;padding-right:max(10px, env(safe-area-inset-right, 0px));padding-bottom:max(10px, env(safe-area-inset-bottom, 0px))}
.stagecol{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.scenewrap{position:relative;flex:1 1 auto;min-height:160px;border-radius:6px;overflow:hidden;background:#231d19;border:1px solid var(--line)}
#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.scene-cap{position:absolute;left:8px;top:7px;font-family:var(--font-m);font-size:11px;color:#EFE6DA;background:rgba(20,14,10,.6);padding:3px 7px;border-radius:3px;pointer-events:none;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;justify-content:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-weight:500;font-size:12.5px;min-width:0}
.status span{font-family:var(--font-m);color:var(--muted);font-size:11px;flex:none}
.status em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status.bad em{color:var(--bad)} .status.ok em{color:var(--ok)}
.info{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;flex:none;max-height:34%;overflow:auto}
.info h3,.sheet h3.k{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-family:var(--font-b);font-weight:600;margin-bottom:4px}
.info p{margin:0;max-width:72ch;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.panel h2{font-size:19px;font-weight:800;letter-spacing:-.01em}
.panel .sub{color:var(--muted);margin-top:1px;font-size:12.5px}
.sec{display:flex;flex-direction:column;gap:7px}
.sec-t{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.ctl{display:flex;flex-direction:column;gap:1px}
.ctl-h{display:flex;justify-content:space-between;gap:8px;font-weight:500;font-size:13px}
.ctl output{font-family:var(--font-m);font-variant-numeric:tabular-nums;font-size:12.5px}
.ctl small{color:var(--muted);font-size:11.5px}
input[type=range]{width:100%;accent-color:var(--accent);height:22px;margin:0}
.gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.g{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--surface2);display:flex;flex-direction:column;gap:4px;min-width:0}
.g-h{display:flex;justify-content:space-between;align-items:baseline;gap:4px;font-size:11.5px;color:var(--muted);min-width:0}
.g-h>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.g-h b{font-family:var(--font-m);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.g-h i{font-style:normal;font-size:10.5px;color:var(--muted);margin-left:2px}
.g-bar{position:relative;height:7px;background:var(--line);border-radius:2px}
.g-zone{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.35;border-radius:2px}
.g-mark{position:absolute;top:-3px;width:4px;height:13px;margin-left:-2px;border-radius:1px;background:var(--ink)}
.g-s{display:flex;justify-content:space-between;font-family:var(--font-m);font-size:9.5px;color:var(--muted)}
.g-ok{border-left:4px solid var(--ok)} .g-warn{border-left:4px solid var(--warn)} .g-bad{border-left:4px solid var(--bad)}
.g-bad .g-h b{color:var(--bad)}
.g .btns button{padding:5px 8px;font-size:12px}
.prog{display:flex;flex-direction:column;gap:3px}
.prog .ph{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted)}
.prog .ph b{font-family:var(--font-m);color:var(--ink);white-space:nowrap}
.prog .pb{height:9px;background:var(--line);border-radius:2px;overflow:hidden}
.prog .pb span{display:block;height:100%;background:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:7px}
button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:8px 12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;line-height:1.2;-webkit-tap-highlight-color:transparent}
button:hover:not(:disabled){border-color:var(--ink)}
button:focus-visible,input:focus-visible,.chip:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.pri:hover:not(:disabled){filter:brightness(1.08);border-color:var(--accent)}
button.danger{border-color:var(--bad);color:var(--bad);background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
button small{font-weight:500;opacity:.8;font-family:var(--font-m);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--surface2);cursor:pointer;font-size:12.5px;-webkit-tap-highlight-color:transparent}
.chip input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.chip b{font-weight:600}
.chip i{font-style:normal;font-family:var(--font-m);font-size:11px;color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
.chip.on i{color:var(--ink)}
.desc{color:var(--muted);font-size:12px;margin-top:-2px}
.desc .np{display:none}
.note{border-radius:4px;padding:7px 10px;font-size:12.5px;background:var(--surface2);border:1px solid var(--line)}
.note.bad{border-color:var(--bad);color:var(--bad)} .note.warn{border-color:var(--warn)} .note.ok{border-color:var(--ok)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-family:var(--font-m);text-align:right;font-variant-numeric:tabular-nums}
.kv .tot{border-top:1px solid var(--line);padding-top:4px;color:var(--ink)!important;font-weight:600}
.chart{width:100%;height:auto;display:block;max-height:120px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2}
.chart .bd{fill:var(--ok);opacity:.16}
.chart .ax{fill:var(--muted);font-family:var(--font-m);font-size:9px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .pt{fill:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-2px;margin-right:4px;border:1px solid rgba(0,0,0,.25)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
.seg button{border:0;border-radius:0;justify-content:center;background:var(--surface2);flex-direction:column;gap:1px;padding:7px 6px;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button small{font-family:var(--font-b);font-weight:500;font-size:10.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 8px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.cardrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:7px}
.card{border:1px solid var(--line);border-radius:4px;padding:9px 11px;background:var(--surface2);display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.card span{color:var(--muted);font-size:12px}
.stars{font-size:22px;letter-spacing:3px;color:var(--accent);line-height:1}
.shop{display:grid;gap:7px}
.shop .it{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--surface2)}
.shop .it div{min-width:0}
.shop .it span{color:var(--muted);font-size:12px;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{font-family:var(--font-m)} .tbl td:first-child{font-family:var(--font-b)}

.ctls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.ctls>:only-child{grid-column:1/-1}
.ctls .ctl-h{flex-wrap:wrap;column-gap:6px}
.ctls .ctl-h output{margin-left:auto}
.sum{font-size:12.5px;color:var(--muted);line-height:1.55}
.sum b{font-family:var(--font-m);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* zaman akışı */
.timebar{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.timebar .play{min-width:9.5em;justify-content:center}
.speed{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.speed button{border:0;border-radius:0;padding:7px 10px;background:var(--surface2);font-family:var(--font-m);font-size:12.5px}
.speed button+button{border-left:1px solid var(--line)}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.timebar .play[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:calc(100% - 20px);background:rgba(20,16,12,.88);color:#F4EEE4;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:7px 12px;font-size:12.5px;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:bubin .18s ease-out;pointer-events:none;text-align:center}
.toast b{color:#F2C66B;font-weight:600}

/* tanıtım turu: vurgulanan bölüm + minik pencere */
#tour{position:fixed;inset:0;z-index:30}
#tour.dim{background:rgba(8,10,8,.6)}
.spot{position:fixed;border-radius:8px;box-shadow:0 0 0 9999px rgba(8,10,8,.6);outline:2px solid var(--accent);pointer-events:none;transition:left .25s,top .25s,width .25s,height .25s}
.bub{position:fixed;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px;box-shadow:0 12px 32px rgba(0,0,0,.32);display:flex;flex-direction:column;gap:5px;animation:bubin .18s ease-out}
.bub-k{font-family:var(--font-m);font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.bub h3{font-size:16.5px;font-weight:800}
.bub p{margin:0;font-size:13px;line-height:1.45}
.bub-f{display:flex;align-items:center;gap:6px;margin-top:5px}
.bub-f .sp{flex:1}
.dots{display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
button.lnk{background:none;border:0;color:var(--muted);padding:6px 4px;font-weight:500}
button.lnk:hover:not(:disabled){border:0;color:var(--ink)}
@keyframes bubin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* açılır pencere: bilgi ve çiftlik defteri */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,12,10,.45);display:grid;place-items:center;padding:16px}
.sheet-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:min(560px,100%);max-height:85%;display:flex;flex-direction:column;overflow:hidden}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:17px}
.sheet-b{padding:12px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.sheet-b p{margin:0}
#log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#log li{display:grid;grid-template-columns:56px 1fr;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
#log li span{font-family:var(--font-m);color:var(--muted);font-size:11.5px;padding-top:1px}
#log li.bad{color:var(--bad)} #log li.ok{color:var(--ok)}

/* telefon / dar ekran: sahne üstte, panel altta; menü ince şerit */
@media (max-width:899px){
  :root{--rail:70px}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:7px;padding:7px}
  .stagecol{gap:6px}
  .scenewrap{flex:none;height:clamp(140px,27vh,250px);min-height:0}
  .app[data-stage="hasat"] .scenewrap{height:clamp(220px,46vh,460px)}
  .app[data-compact] .scenewrap{height:clamp(90px,14vh,170px)}
  .info{display:none}
  .st{grid-template-columns:1fr;grid-template-rows:auto auto;justify-items:center;text-align:center;padding:7px 3px;row-gap:3px}
  .st .num{grid-row:auto}
  .st .nm{font-size:10.5px;font-family:var(--font-b);font-weight:600}
  .st .sb{display:none}
  .st .full{display:none} .st .kisa{display:inline}
  .seg .full,.seg small,.opt{display:none!important}
  .g{padding:5px 7px;gap:3px} .g-s{display:none} .g-h b{font-size:14px}
  .chip{padding:5px 9px;font-size:12px}
  .chip i{display:none} .desc .np{display:inline}
  .card{padding:7px 9px;gap:4px} .card span{font-size:11.5px}
  .sec{gap:6px}
  .st+.st::before{left:50%;top:-5px;height:8px}
  .brand h1{font-size:16px}
  .brand svg{width:26px;height:26px}
  .stat.opt{display:none}
  .ctl small,.desc.opt{display:none}
  .sec:has(> .chart){display:none}
  .panel{padding:10px 11px;gap:8px}
  .panel h2{font-size:16.5px}
  .tb button{padding:6px 8px}
  .timebar{gap:5px} .timebar .play{min-width:0;padding:8px 10px} .speed button{padding:7px 8px} .timebar>button:not(.play){padding:8px 9px}
}
@media (max-width:420px){ .brand h1{display:none} .tb .lbl{display:none} }
@media (max-height:560px) and (min-width:900px){ .info{display:none} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<div class="app" lang="tr" id="app">
  <header class="top">
    <div class="brand"><svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 20c0-9 7-15 16-15s16 6 16 15c0 2-1 3-3 3H7c-2 0-3-1-3-3z" fill="var(--accent)"/><path d="M15 23h10l-1 11c0 1-1 2-2 2h-4c-1 0-2-1-2-2z" fill="var(--ink)" opacity=".85"/><circle cx="13" cy="14" r="2" fill="var(--surface)"/><circle cx="24" cy="11" r="1.6" fill="var(--surface)"/><circle cx="28" cy="17" r="1.3" fill="var(--surface)"/></svg><h1>Mantar Çiftliği</h1></div>
    <div class="stats" id="stats"></div>
    <div class="tb">
      <button data-act="sheet:info" aria-label="Bilgi"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 7v4.5M8 4.6v.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="lbl">Bilgi</span></button>
      <button data-act="sheet:log" aria-label="Çiftlik defteri"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h8.5a1.5 1.5 0 0 1 1.5 1.5v9.5H4.5A1.5 1.5 0 0 1 3 12z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 6h5M5.5 9h5" stroke="currentColor" stroke-width="1.4"/></svg><span class="lbl">Defter</span></button>
    </div>
  </header>
  <nav class="rail" id="steps" aria-label="Üretim aşamaları"></nav>
  <main class="main">
    <section class="stagecol">
      <div class="scenewrap"><canvas id="scene" aria-label="Çiftlik görünümü"></canvas><div class="scene-cap" id="sceneCap"></div><div class="toast" id="toast" hidden></div></div>
      <button class="status" id="status" data-act="sheet:log"></button>
      <div class="info" id="info"></div>
    </section>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
  <div class="sheet" id="sheet" hidden></div>
  <div id="tour" hidden></div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=(n,d=0)=>Number(n).toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d});
const tl=n=>fmt(Math.round(n))+' ₺';
const band=(v,lo,hi,tol)=>{ if(v>=lo&&v<=hi) return 1; const d=v<lo?lo-v:v-hi; return clamp(1-d/tol,0,1); };
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rng=Math.random;

/* ---------- veri ---------- */
const VENT=['Kapalı','Düşük','Orta','Yüksek'];
const STRAINS=[
  {name:'Beyaz – standart hat',price:140,yield:1.0,pm:1,brown:false,d:'Dengeli, hataları affeden hat.'},
  {name:'Beyaz – yüksek verimli hat',price:210,yield:1.12,pm:1,brown:false,d:'%12 daha fazla ürün, misel daha pahalı.'},
  {name:'Kestane (kahverengi) hat',price:180,yield:0.9,pm:1.35,brown:true,d:'Daha az ürün, %35 daha yüksek satış fiyatı.'},
];
const CASINGS=[
  {name:'Siyah torf + kireç',price:950,q:1.0,risk:1,d:'Klasik karışım, suyu iyi tutar.'},
  {name:'Siyah + beyaz torf karışımı',price:1250,q:1.07,risk:1,d:'Daha gözenekli, iğne başları daha düzenli çıkar.'},
  {name:'Bahçe toprağı',price:250,q:0.72,risk:1.8,d:'Ucuz ama yapısı bozuk ve hastalık taşır.'},
];
const WET=['Kuru','İdeal','Çok ıslak'];
const PRICE={A:115,B:78,C:48};
const UPG=[
  {id:'hepa',name:'HEPA filtreli kuluçka havası',price:45000,d:'Küf ve sinek riski %40 azalır.'},
  {id:'klima',name:'Hassas iklim kontrol sistemi',price:35000,d:'Kompost sıcaklığı ayara daha hızlı uyar, CO₂ daha kolay düşer.'},
  {id:'paket',name:'Paketleme ve soğuk zincir',price:55000,d:'Tüm satış fiyatları %12 artar.'},
  {id:'saha',name:'Genişletilmiş kompost sahası',price:70000,d:'Karışım üst sınırları %50 artar.'},
];
const STEPS=[
  {name:'Kompost',kisa:'Kompost',sub:'Faz I',st:['karisim','faz1']},
  {name:'Pastörizasyon',kisa:'Pastörize',sub:'Faz II',st:['faz2']},
  {name:'Misel ekimi',kisa:'Ekim',sub:'Tohumlama',st:['ekim']},
  {name:'Kuluçka odası',kisa:'Kuluçka',sub:'Misel sarması',st:['kulucka']},
  {name:'Üretim odası',kisa:'Üretim',sub:'Örtü ve şok',st:['ortu','caserun','sok']},
  {name:'Hasat',sub:'3 flaş',st:['hasat']},
  {name:'Satış',sub:'Parti raporu',st:['rapor']},
];

/* ---------- durum ---------- */
function newBatch(sp){ sp=sp||'o'; return{
  sp,stage:sp==='o'?'o_karisim':'karisim',costs:{},log:[],notes:{},o:sp==='o'?newO():null,
  mix:{straw:5,manure:4,gypsum:150,water:12},mixQ:0,mixInfo:null,
  f1:null,f2:null,comp:null,
  ekim:{rate:0.6,strain:0,dez:true,onluk:true,filtre:false},
  spawn:null,bio:{contam:0,spots:0,pests:0,pestDays:0},
  kul:null,ortu:{type:0,ph:7.5,thick:4.5,wet:1},ortuQ:1,cr:null,ruffled:false,
  sok:null,pinQ:1,kulF:1,h:null,rep:null
};}
function newGame(){return{money:250000,day:1,batchNo:1,up:{},best:null,history:[],lastSp:'o',B:newBatch('o')};}
let G;
function load(){ try{ const s=localStorage.getItem('mantarCiftligi.v1'); if(s){ const g=JSON.parse(s); if(g&&g.B) return g; } }catch(e){} return null; }
function save(){ try{ localStorage.setItem('mantarCiftligi.v1',JSON.stringify(G)); }catch(e){} }
let B;

function pay(label,amt){ amt=Math.round(amt); G.money-=amt; B.costs[label]=(B.costs[label]||0)+amt; }
function log(msg,kind=''){ if(typeof AUTO!=='undefined'&&AUTO.on&&(kind==='bad'||kind==='ok')&&!AUTO.pause) AUTO.pause=msg; B.log.unshift({d:G.day,msg,kind}); if(B.log.length>80) B.log.pop(); }

/* ---------- hesaplar ---------- */
const cap=()=>G.up.saha?1.5:1;
function mixStats(m){
  const sDM=m.straw*0.88, mDM=m.manure*0.65, gDM=m.gypsum/1000;
  const DM=sDM+mDM+gDM;
  const N=sDM*0.005+mDM*0.035, C=sDM*0.45+mDM*0.32;
  const water=m.straw*0.12+m.manure*0.35+m.water;
  return {DM,N:N/DM*100,CN:C/N,moist:water/(DM+water)*100,gyp:gDM/DM*100,total:DM+water};
}
const mixScore=s=>0.3*band(s.N,1.5,1.9,0.6)+0.25*band(s.CN,20,28,8)+0.3*band(s.moist,70,77,8)+0.15*band(s.gyp,3,6,3.5);
const mixCost=m=>m.straw*3500+m.manure*2000+m.gypsum*6+m.water*40+4000;
const ventCO2=(v)=>Math.round(450+4200/(1+v*(G.up.klima?3:2.3)));
function ortuCalc(){ const o=B.ortu, c=CASINGS[o.type];
  const q=c.q*band(o.ph,7.2,7.9,1.2)*band(o.thick,4,5,2.2)*[0.8,1,0.85][o.wet];
  const area=B.comp?B.comp.t*1000/85:180; const vol=area*o.thick/100;
  return {q,area,vol,cost:vol*c.price+3000}; }

/* ---------- aksiyonlar ---------- */
const ACT={
  mix(){ const s=mixStats(B.mix); pay('Kompost hammaddesi',mixCost(B.mix));
    B.mixInfo=s; B.mixQ=mixScore(s);
    B.f1={day:0,temp:28,o2:18,moist:s.moist,prog:0,anaer:0,turns:0,hist:[28],anim:-9};
    B.stage='faz1';
    log(`Karışım kuruldu: ${fmt(B.mix.straw,1)} t sap, ${fmt(B.mix.manure,1)} t gübre, ${fmt(B.mix.gypsum)} kg jips, ${fmt(B.mix.water)} m³ su. Azot %${fmt(s.N,2)}, C/N ${fmt(s.CN,1)}, nem %${fmt(s.moist,1)}.`);
    if(B.mixQ<0.8) log('Karışım oranları hedeflerin dışında; kompost kalitesi düşük olabilir.','bad');
  },
  f1(a){ const f=B.f1; if(f.day>=18) return;
    if(a==='aktar'){ f.o2=19; f.temp-=12; f.moist-=1.5; f.turns++; f.anim=performance.now()/1000; pay('Kompost aktarma',1800); log(`Yığın aktarıldı (${f.turns}. aktarma).`); }
    if(a==='sula'){ f.moist+=3; pay('Su',400); log('Yığına su verildi.'); }
    const mf=clamp(1-Math.abs(f.moist-74)/18,0.1,1), of=f.o2>6?1:f.o2/6;
    const target=40+42*mf*of;
    f.temp+=(target-f.temp)*0.6;
    f.o2=Math.max(0,f.o2-(4+Math.max(0,f.temp-40)*0.04));
    f.moist-=0.5+Math.max(0,f.temp-50)*0.035;
    if(f.o2<2){ f.anaer++; log('Yığının içi oksijensiz kaldı, kötü koku başladı (anaerobik bölge).','bad'); }
    const tf=f.temp>=62&&f.temp<=82?1:f.temp>=50?0.75:0.35;
    const was=f.prog;
    f.prog=Math.min(100,f.prog+10.5*tf*mf*(f.o2>=2?1:0.5));
    f.day++; G.day++; f.hist.push(+f.temp.toFixed(1));
    if(f.prog>=100&&was<100) log('Faz I kompostu olgunlaştı. Tünele taşıyabilirsiniz.','ok');
  },
  f1done(){ const f=B.f1;
    const q1=B.mixQ*(1-0.07*f.anaer)*(0.55+0.45*Math.min(1,f.prog/100))*(0.6+0.4*band(f.moist,68,78,10));
    B.q1=clamp(q1,0.2,1);
    const nh3=Math.round(220+B.mixInfo.N*140+f.anaer*25);
    B.f2={hour:0,set:52,fresh:20,temp:48,nh3,nh30:nh3,pastH:0,over:0,hist:[48]};
    if(f.anaer) B.notes.anaer=f.anaer; if(f.prog<100) B.notes.f1short=1; if(B.mixQ<0.8) B.notes.mix=1;
    B.stage='faz2'; pay('Tünele doldurma',3500);
    log(`Kompost pastörizasyon tüneline dolduruldu. Amonyak ${nh3} ppm.`);
  },
  f2(n){ const f=B.f2; for(let i=0;i<n;i++){ if(f.hour>=14*24) break;
      const self=f.temp>=40&&f.temp<=60?3:1;
      const target=f.set+self-f.fresh*0.04;
      f.temp+=(target-f.temp)*(G.up.klima?0.6:0.45);
      const wasPast=f.pastH>=8;
      if(f.temp>=57&&f.temp<=63) f.pastH+=4;
      if(f.temp>63){ f.over+=4; if(f.over===4) log('Kompost 63 °C\'yi aştı! Faydalı mikroorganizmalar ölüyor.','bad'); }
      if(!wasPast&&f.pastH>=8) log('Pastörizasyon tamamlandı (8 saat 57–63 °C). Şimdi koşullandırma: 45–48 °C ve taze hava.','ok');
      let k=f.temp>=44&&f.temp<=50?0.16:(f.temp>=40&&f.temp<56)?0.08:0.025;
      k*=0.4+f.fresh/100*0.9;
      const before=f.nh3; f.nh3=Math.max(0,f.nh3*(1-k)-1);
      if(before>10&&f.nh3<=10) log('Amonyak 10 ppm\'in altına indi. Kompost ekime hazır.','ok');
      pay('Tünel enerjisi',180+Math.max(0,f.set-20)*9+f.fresh*5);
      f.hour+=4; if(f.hour%24===0) G.day++;
      f.hist.push(+f.temp.toFixed(1)); }
  },
  f2done(){ const f=B.f2, days=f.hour/24;
    const past=f.pastH>=8;
    const q2=(past?1:0.85)*(1-Math.min(0.35,f.over*0.012))*(1-Math.max(0,days-8)*0.03);
    B.comp={t:B.mixInfo.total*0.6*(1-Math.max(0,days-7)*0.02),q:clamp(B.q1*q2,0.15,1),nh3:Math.round(f.nh3),past};
    if(!past) B.notes.past=1; if(f.over) B.notes.over=f.over; if(f.nh3>10) B.notes.nh3=Math.round(f.nh3);
    B.stage='ekim'; pay('Tünel boşaltma ve soğutma',2500);
    log(`Tünel boşaltıldı: ${fmt(B.comp.t,1)} ton kompost, kalite %${fmt(B.comp.q*100)}.`);
    if(f.nh3>10) log(`Kompostta hâlâ ${Math.round(f.nh3)} ppm amonyak var; misel zarar görecek.`,'bad');
  },
  ekim(){ const e=B.ekim, st=STRAINS[e.strain], c=B.comp;
    const kg=c.t*1000*e.rate/100;
    pay('Misel (tohumluk)',kg*st.price);
    if(e.dez) pay('Hijyen',5000); if(e.onluk) pay('Hijyen',2000); if(e.filtre) pay('Hijyen',8000);
    const dmg=c.nh3>10?Math.min(0.6,(c.nh3-10)/60):0;
    const hepa=G.up.hepa?0.6:1;
    const risk=0.09*(c.past?1:2.6)*(e.dez?0.65:1)*(e.onluk?0.85:1)*(e.filtre?0.7:1)*hepa;
    const pestRisk=0.07*(e.filtre?0.5:1)*hepa*(c.past?1:1.8);
    B.spawn={kg,rate:e.rate,strain:e.strain,dmg,risk,pestRisk};
    B.kul={day:0,set:23,hum:93,vent:1,ctemp:26,col:0,co2:3600,dmg:0,hist:[26]};
    B.stage='kulucka';
    log(`${fmt(kg)} kg ${st.name} miseli komposta karıştırıldı ve raflara dolduruldu.`);
    if(dmg>0) log('Amonyak miseli yaktı; bazı tohumlar çimlenmedi.','bad');
  },
  grow(n){ const mode=B.stage==='kulucka'?'kul':'cr'; const S=mode==='kul'?B.kul:B.cr;
    for(let i=0;i<n;i++){ if(S.col>=100||S.day>=30) break; const sp=B.bio.spots, pe=B.bio.pests; growDay(S,mode); if(n>1&&(B.bio.spots>sp||B.bio.pests>pe)) break; } },
  clean(){ const b=B.bio; pay('Hastalık mücadelesi',1200*b.spots); log(`${b.spots} küf lekesi kireç ve tuzla kapatıldı, çevresi temizlendi.`,'ok'); b.spots=0; },
  trap(){ pay('Hastalık mücadelesi',1500); log('Sarı yapışkan tuzaklar ve ışık tuzağı kuruldu, sinekler kontrol altında.','ok'); B.bio.pests=0; },
  kuldone(){ const S=B.kul; B.kulF=clamp(1-S.dmg/100,0.3,1)*Math.min(1,0.4+0.6*S.col/100);
    if(S.dmg>0) B.notes.heat=Math.round(S.dmg); B.stage='ortu';
    log(`Kuluçka bitti (${S.day} gün). Kolonizasyon %${fmt(S.col)}.`); },
  ortu(){ const o=ortuCalc(); pay('Örtü toprağı',o.cost); B.ortuQ=clamp(o.q,0.4,1.07);
    if(o.q<0.85) B.notes.casing=1;
    B.cr={day:0,set:23,hum:94,vent:1,ctemp:B.kul.ctemp,col:0,co2:5000,dmg:0,hist:[+B.kul.ctemp.toFixed(1)]};
    B.stage='caserun';
    log(`${fmt(o.vol,1)} m³ örtü toprağı (${CASINGS[B.ortu.type].name}) ${fmt(B.ortu.thick,1)} cm kalınlıkta serildi.`); },
  ruffle(){ B.ruffled=true; pay('Örtü karıştırma',2500); log('Örtü toprağı karıştırıldı (ruffling); misel daha eşit dağılacak.','ok'); },
  crdone(){ const S=B.cr; B.ortuQ*=Math.min(1,0.5+0.5*S.col/100);
    B.sok={day:0,set:22,hum:92,vent:1,ctemp:S.ctemp,co2:ventCO2(1),pins:0,qsum:0,qdays:0,hist:[+S.ctemp.toFixed(1)]};
    B.stage='sok'; log('Misel örtü toprağının yüzeyine ulaştı. Şoklama zamanı.'); },
  sok(n){ const S=B.sok; for(let i=0;i<n;i++){ if(S.pins>=100||S.day>=12) break; sokDay(S); } },
  sokdone(){ const S=B.sok; B.pinQ=(S.qdays?S.qsum/S.qdays:0.4)*Math.min(1,0.3+0.7*S.pins/100);
    if(B.pinQ<0.75) B.notes.pin=1; startHarvest(); },
  flush(){ startFlush(); },
  water(w){ const h=B.h;
    if(isO()){ h.waterMult=[0.85,1,1.12][w]; h.wetBoost=[-2,0,2][w]; pay('Nemlendirme',[0,800,1500][w]); pay('Enerji ve işçilik',10*900); G.day+=10;
      log(`Flaşlar arası: torbalar ${['kuru dinlendirildi','püskürtülerek nemlendirildi','suya batırıldı'][w]}. 10 gün sonra yeni flaş geliyor.`); }
    else { h.waterMult=[0.82,1,0.97][w]; h.wetBoost=[-1,0,3][w]; pay('Sulama',[600,1000,1600][w]); pay('Enerji ve işçilik',7*900); G.day+=7;
      log(`Flaşlar arası sulama: ${['az','orta','bol'][w]}. 7 gün sonra yeni flaş geliyor.`); }
    startFlush(); },
  sell(){ finishBatch(); },
  buy(id){ const u=UPG.find(x=>x.id===id); if(!u||G.up[id]||G.money<u.price) return; G.money-=u.price; G.up[id]=true; log(`Yatırım yapıldı: ${u.name}.`,'ok'); },
  rtab(k){ rapTab=k; },
  auto(){ if(AUTO.on){ AUTO.on=false; return; } const T=TICK[B.stage]; if(!T||(T.ok&&!T.ok())) return; AUTO.on=true; AUTO.stage=B.stage; AUTO.pause=null; AUTO.acc=T.s/AUTO.speed*0.7; },
  speed(v){ AUTO.speed=v; },
  hspeed(v){ AUTO.hs=v; },
  tour(){ sheet=null; setTimeout(startTour,80); },
  tips(){ PREF.tipsOff=!PREF.tipsOff; if(!PREF.tipsOff) PREF.tips={}; savePref(); },
  sheet(x){ sheet=x; },
  shut(){ sheet=null; confirmReset=false; },
  next(){ rapTab=0; G.batchNo++; G.day+=2; B=G.B=newBatch(G.lastSp||B.sp); log(`${G.batchNo}. parti başladı.`); },
  species(x){ const lg=B.log; B=G.B=newBatch(x); B.log=lg; G.lastSp=x; log(x==='o'?'Bu parti için istiridye mantarı seçildi.':'Bu parti için beyaz şapkalı mantar seçildi.'); },
  reset(arg){ if(arg!=='ok'){ confirmReset=true; return; } G=newGame(); B=G.B; H=null; confirmReset=false; sheet=null; rapTab=0; AUTO.on=false; log('Yeni çiftlik kuruldu. Kasada 250.000 ₺ var.'); },
  resetno(){ confirmReset=false; },
};
let confirmReset=false, rapTab=0, sheet=null;

function growDay(S,mode){
  const k=G.up.klima?0.85:0.6;
  const metab=mode==='kul'?1.5+6.5*Math.sin(Math.PI*Math.min(1,S.col/100)):2.5;
  S.ctemp+=((S.set+metab-S.vent*1.5)-S.ctemp)*k;
  S.co2=Math.round(900+9000*(0.3+0.7*S.col/100)/(1+S.vent*1.3));
  const t=S.ctemp;
  const tf=(t>=24&&t<=27)?1:(t>=22&&t<=28)?0.78:(t>=20&&t<=30)?0.5:t>30?0.15:0.25;
  if(t>30){ S.dmg+=(t-30)*2.5; log(`Kompost ${fmt(t,1)} °C! Misel aşırı ısıdan zarar görüyor.`,'bad'); }
  const hf=S.hum>=90?1:S.hum>=85?0.8:0.55;
  if(mode==='kul'){ const cf=S.co2>=4000?1.05:0.95; const sf=0.7+0.4*Math.min(1,B.spawn.rate);
    S.col=Math.min(100,S.col+7.4*tf*hf*cf*sf*(1-B.spawn.dmg)*(0.6+0.4*B.comp.q)); }
  else { const th=B.ortu.thick>5.5?0.8:1; S.col=Math.min(100,S.col+15*tf*hf*th*(0.7+0.3*Math.min(1,B.ortuQ))); }
  pay('Enerji ve işçilik',700+Math.abs(S.set-15)*45+S.vent*220+Math.max(0,S.hum-85)*30);
  riskDay(S,mode==='cr'?CASINGS[B.ortu.type].risk*(B.ortu.wet===2?1.4:1)*0.8:1);
  S.day++; G.day++; S.hist.push(+S.ctemp.toFixed(1));
  if(S.col>=100) log(mode==='kul'?'Misel kompostu tamamen sardı! Kuluçka tamam.':'Misel örtü toprağını sardı.','ok');
}
function riskDay(S,mult){
  const b=B.bio; const r=B.spawn.risk*mult*(S.ctemp>28?1.6:1)*(S.hum>96?1.5:1);
  if(rng()<r){ b.spots++; log('Yeşil küf (Trichoderma) lekesi görüldü!','bad'); }
  if(rng()<B.spawn.pestRisk*mult){ if(!b.pests) log('Mantar sinekleri (Sciarid) görüldü!','bad'); b.pests++; }
  b.contam=Math.min(60,b.contam+b.spots*1.4+b.pests*0.3);
  if(b.pests) b.pestDays++;
}
function sokDay(S){
  const k=G.up.klima?0.7:0.45;
  S.ctemp+=(S.set+1.5-S.vent*0.6-S.ctemp)*k;
  S.co2=ventCO2(S.vent);
  const humEff=S.hum-S.vent*1.2;
  const q=band(S.ctemp,16,19,4)*band(S.co2,0,1000,1400)*band(humEff,85,93,7);
  const before=S.pins;
  S.pins=Math.min(100,S.pins+38*q);
  if(q>0.15){ S.qsum+=q; S.qdays++; }
  pay('Enerji ve işçilik',700+Math.abs(S.set-15)*45+S.vent*260+Math.max(0,S.hum-85)*30);
  riskDay(S,0.5);
  S.day++; G.day++; S.hist.push(+S.ctemp.toFixed(1));
  if(before<30&&S.pins>=30) log('Örtü toprağında ilk iğne başları (primordia) göründü!','ok soft');
  if(S.pins>=100) log('İğne başları tamamlandı. Hasada hazırlanın.','ok');
  if(q<0.15&&S.day>=3) log('İğne başı oluşmuyor: sıcaklığı 16–19 °C\'ye düşürün, CO₂\'yi 1000 ppm altına indirin.','bad');
}

/* ---------- hasat ---------- */
let H=null;
function startHarvest(){
  const b=B.bio, st=STRAINS[B.spawn.strain];
  const BE=0.31*(0.45+0.55*B.comp.q)*B.kulF*(1-Math.min(0.7,b.contam/100))*(1-Math.min(0.3,b.pestDays*0.012))*B.ortuQ*(0.55+0.45*B.pinQ)*(1-B.spawn.dmg*0.6)*st.yield*(B.ruffled?1.04:1);
  if(b.contam>5) B.notes.contam=Math.round(b.contam); if(b.pestDays>3) B.notes.pest=b.pestDays;
  B.h={flush:0,phase:'ready',totalKg:B.comp.t*1000*BE,BE,kg:{A:0,B:0,C:0},lost:0,waterMult:1,wetBoost:0,set:17,hum:90,vent:2};
  B.stage='hasat';
  log('Üretim odası hasada hazır. İlk flaş geliyor.');
}
const isO=()=>B.sp==='o';
function curStrain(){ return isO()?OSTR[B.o.spawn.strain]:STRAINS[B.spawn.strain]; }
function startFlush(){
  const h=B.h,k=h.flush,O=isO(); const kg=h.totalKg*(O?[0.55,0.3,0.15]:[0.5,0.32,0.18])[k]*h.waterMult;
  const n=(O?[24,18,12]:[44,34,26])[k]; const r=mulberry32(G.batchNo*131+k*17+3); const sp=[];
  if(O){ const slots=oLayout().slots.slice(); for(let i=slots.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [slots[i],slots[j]]=[slots[j],slots[i]]; }
    for(let i=0;i<n;i++) sp.push({x:slots[i].x,y:slots[i].y,born:r()*20,j:0.85+r()*0.3,s:0,bl:false,ls:false,dry:false,pk:false,dead:false}); }
  else for(let i=0;i<n;i++){ let x,y,ok=false,tries=0;
    while(!ok&&tries<40){ x=0.06+r()*0.88; y=0.12+r()*0.8; ok=sp.every(s=>Math.hypot((s.x-x)*1.6,s.y-y)>0.085); tries++; }
    sp.push({x,y,born:r()*24,j:0.85+r()*0.3,s:0,bl:false,ls:false,pk:false,dead:false}); }
  H={t:0,sp,kgPer:kg/n,fl:[],acc:{A:0,B:0,C:0,lost:0},last:performance.now()};
  h.phase='running'; liveTick=0;
}
function hClimate(){ const h=B.h;
  if(isO()){ const st=curStrain(), mid=(st.fr[0]+st.fr[1])/2;
    return {rate:(1/14)*Math.max(0.3,1+(h.set-mid)*0.08)*(st.fast||1), co2:oCO2(h.vent), humEff:h.hum-h.vent*1.5+h.wetBoost-(CUTS[B.o.cut].dry?4:0)}; }
  return {rate:(1/15)*Math.max(0.3,1+(h.set-17)*0.13), co2:ventCO2(h.vent), humEff:h.hum-h.vent*1.2+h.wetBoost}; }
function harvestUpdate(dt){
  const h=B.h, O=isO(); H.t+=dt;
  const c=hClimate();
  let active=0;
  for(const s of H.sp){ if(s.pk||s.dead) continue; active++; if(H.t<s.born) continue;
    const prev=s.s; s.s+=dt*c.rate*s.j;
    if(prev<0.45&&s.s>=0.45){
      if(O){ const st=curStrain(); if(c.co2>1000||h.light<6||h.set<st.fr[0]-3||h.set>st.fr[1]+3) s.ls=true; if(c.humEff<78) s.dry=true; }
      else if(c.co2>1100) s.ls=true; }
    const blT=O?96:93;
    if(s.s>0.3&&!s.bl&&c.humEff>blT&&Math.random()<dt*0.02*(c.humEff-blT)) s.bl=true;
    if(s.s>1.2){ s.dead=true; H.acc.lost+=H.kgPer*1.1; } }
  if(active===0) endFlush();
}
function pickAt(px,py){
  if(!H||B.h.phase!=='running') return;
  const O=isO(); let best=null,bd=1e9;
  for(const s of H.sp){ if(s.pk||s.dead||H.t<s.born||s.s<0.12) continue;
    const p=bedPos(s), r=mushR(s.s)*(O?1.5:1)+10, d=Math.hypot(p.x-px,p.y-py);
    if(d<r&&d<bd){bd=d;best=s;} }
  if(!best) return;
  const h=B.h, s=best; let w=H.kgPer*Math.min(1.15,0.35+s.s), cls;
  if(s.s<0.45){cls='C';w*=0.7;} else if(s.s<0.75) cls='A'; else if(s.s<0.92) cls='B'; else cls='C';
  if(s.bl||s.ls) cls=cls==='A'?'B':'C';
  if(O){ if(s.dry) w*=0.85; } else if(hClimate().humEff<84) w*=0.9;
  s.pk=true; H.acc[cls]+=w;
  const p=bedPos(s); H.fl.push({x:p.x,y:p.y,t:H.t,txt:`${cls} +${fmt(w,1)} kg`,c:cls==='A'?'#8BE0A6':cls==='B'?'#F2C66B':'#F09A8A'});
}
function endFlush(){
  const h=B.h,a=H.acc; const got=a.A+a.B+a.C;
  h.kg.A+=a.A; h.kg.B+=a.B; h.kg.C+=a.C; h.lost+=a.lost;
  pay('Hasat işçiliği',got*6); pay('Enerji ve işçilik',4500+h.vent*600+(h.light||0)*150);
  log(`${h.flush+1}. flaş: ${fmt(got)} kg toplandı (A ${fmt(a.A)} · B ${fmt(a.B)} · C ${fmt(a.C)}), ${fmt(a.lost)} kg ${isO()?'aşırı olgunlaşıp bozuldu':'çürüdü'}.`, a.lost>got*0.15?'bad':'ok');
  h.last={...a}; h.flush++; h.phase=h.flush>=3?'done':'between'; H=null; G.day+=3; save(); render();
}
function finishBatch(){
  const h=B.h, st=curStrain(), mult=st.pm*(G.up.paket?1.12:1), P=isO()?PRICE_O:PRICE;
  const rev={A:h.kg.A*P.A*mult,B:h.kg.B*P.B*mult,C:h.kg.C*P.C*mult};
  const revenue=rev.A+rev.B+rev.C; G.money+=revenue;
  const cost=Object.values(B.costs).reduce((a,b)=>a+b,0);
  const total=h.kg.A+h.kg.B+h.kg.C;
  const BE=total/(B.comp.t*1000)*100;
  if(total>0&&h.kg.A/total<0.5) B.notes.late=1;
  if(h.lost>total*0.1) B.notes.lost=Math.round(h.lost);
  B.rep={rev,revenue,cost,profit:revenue-cost,total,BE,mult};
  G.history.push({n:G.batchNo,sp:B.sp,profit:Math.round(revenue-cost),BE:+BE.toFixed(1)});
  if(G.best===null||revenue-cost>G.best) G.best=Math.round(revenue-cost);
  B.stage='rapor'; log(`Ürün satıldı: ${tl(revenue)} gelir. Parti kârı ${tl(revenue-cost)}.`, revenue>cost?'ok':'bad');
}

/* ---------- arayüz parçaları ---------- */
function chips(bind,list,sel,price){ return `<div class="chips" role="radiogroup">${list.map((x,i)=>`<label class="chip ${sel===i?'on':''}"><input type="radio" name="${bind}" value="${i}" ${sel===i?'checked':''} data-bind="${bind}"><b>${x.kisa||x.name}</b>${price?`<i>${price(x)}</i>`:''}</label>`).join('')}</div><small class="desc">${list[sel].kisa?list[sel].name+': ':''}${list[sel].d}${price?` <span class="np">(${price(list[sel])})</span>`:''}</small>`; }
function toggles(list,obj){ return `<div class="chips">${list.map(([k,n,p,d])=>`<label class="chip ${obj[k]?'on':''}" title="${d}"><input type="checkbox" data-bind="${k}" ${obj[k]?'checked':''}><b>${n}</b><i>${tl(p)}</i></label>`).join('')}</div>`; }
let BIND={};
function slider(id,label,val,min,max,step,unit,set,hint,show){
  BIND[id]={set,unit,show:show||(v=>fmt(v,step<1?(step<0.1?2:1):0))};
  return `<label class="ctl" for="${id}"><span class="ctl-h"><span>${label}</span><output id="${id}-o">${BIND[id].show(val)}${unit?' '+unit:''}</output></span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}">${hint?`<small>${hint}</small>`:''}</label>`;
}
function gauge(label,v,unit,min,max,lo,hi,dec=0){
  const p=x=>clamp((x-min)/(max-min)*100,0,100);
  const st=(v>=lo&&v<=hi)?'ok':(band(v,lo,hi,(max-min)*0.12)>0?'warn':'bad');
  const fl=v=>fmt(v,dec);
  return `<div class="g g-${st}"><div class="g-h"><span>${label}</span><b>${fl(v)}<i>${unit}</i></b></div><div class="g-bar"><span class="g-zone" style="left:${p(lo)}%;width:${Math.max(1.5,p(hi)-p(lo))}%"></span><span class="g-mark" style="left:${p(v)}%"></span></div><div class="g-s"><span>${fmt(min)}</span><span>hedef ${fl(lo)}–${fl(hi)}</span><span>${fmt(max)}</span></div></div>`;
}
function prog(label,v,txt){ return `<div class="prog"><div class="ph"><span>${label}</span><b>${txt||'%'+fmt(v)}</b></div><div class="pb"><span style="width:${clamp(v,0,100)}%"></span></div></div>`; }
function chart(hist,lo,hi,okLo,okHi,xlab){
  const W=320,Hh=96,pl=26,pr=6,pt=6,pb=16; if(!hist||hist.length<1) return '';
  const X=i=>pl+(hist.length<2?0:i/(hist.length-1))*(W-pl-pr), Y=v=>pt+(1-(clamp(v,lo,hi)-lo)/(hi-lo))*(Hh-pt-pb);
  const pts=hist.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const last=hist.length-1;
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Sıcaklık geçmişi"><rect class="bd" x="${pl}" y="${Y(okHi)}" width="${W-pl-pr}" height="${Y(okLo)-Y(okHi)}"/>`+
   [lo,okLo,okHi,hi].map(v=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl-4}" y="${Y(v)+3}" text-anchor="end">${v}</text>`).join('')+
   `<polyline class="ln" points="${pts}"/><circle class="pt" cx="${X(last)}" cy="${Y(hist[last])}" r="3"/><text class="ax" x="${W-pr}" y="${Hh-3}" text-anchor="end">${xlab}</text><text class="ax" x="${pl}" y="${Hh-3}">°C</text></svg>`;
}
function climateCtl(S,pre,tmin,tmax,hint){
  return slider(pre+'set','Oda sıcaklığı',S.set,tmin,tmax,0.5,'°C',v=>S.set=v,hint)+
    slider(pre+'hum','Bağıl nem',S.hum,78,99,1,'%',v=>S.hum=v)+
    slider(pre+'vent','Taze hava',S.vent,0,3,1,'',v=>S.vent=v,null,v=>VENT[v]);
}
function bioCtl(){ const b=B.bio; let s='';
  if(b.spots) s+=`<button data-act="clean" class="danger">Küf lekelerini temizle <small>${b.spots} leke · ${tl(1200*b.spots)}</small></button>`;
  if(b.pests) s+=`<button data-act="trap" class="danger">Sinek tuzağı kur <small>${tl(1500)}</small></button>`;
  return s?`<div class="btns">${s}</div>`:''; }
function bioNote(){ const b=B.bio; if(!b.spots&&!b.pests&&b.contam<1) return '';
  return `<div class="note opt ${b.spots||b.pests?'bad':'warn'}">${b.spots?`${b.spots} aktif yeşil küf lekesi yayılıyor. `:''}${b.pests?'Mantar sinekleri raflarda dolaşıyor. ':''}Toplam bulaşma %${fmt(b.contam,1)}.</div>`; }

function tipList(){ const n=B.notes,t=[];
  if(n.mix) t.push(['Karışım oranları hedef dışındaydı. Azot %1,5–1,9, C/N 20–28, nem %70–77, jips %3–6 olmalı.','warn']);
  if(n.anaer) t.push([`Faz I'de yığın ${n.anaer} gün oksijensiz kaldı. 2–3 günde bir aktarın.`,'warn']);
  if(n.f1short) t.push(['Kompost tam olgunlaşmadan tünele taşındı.','warn']);
  if(n.past) t.push(['Pastörizasyon tamamlanmadı. Küf ve sinek riski arttı.','bad']);
  if(n.over) t.push(['Tünelde kompost 63 °C\'yi aştı, faydalı mikroorganizmalar zarar gördü.','warn']);
  if(n.nh3) t.push([`Ekimde kompostta ${n.nh3} ppm amonyak vardı. 10 ppm altına inmeden ekmeyin.`,'bad']);
  if(n.heat) t.push(['Kuluçkada kompost 30 °C\'yi aştı ve misel zarar gördü. Misel ısındıkça oda sıcaklığını düşürün.','bad']);
  if(n.contam) t.push([`Küf ve sinek bulaşması %${n.contam} seviyesine çıktı. Lekeleri hemen temizleyin, hijyene yatırım yapın.`,'warn']);
  if(n.pest) t.push(['Sinekler uzun süre raflarda kaldı. Tuzakları erken kurun.','warn']);
  if(n.casing) t.push(['Örtü toprağı ideal değildi: pH 7,2–7,9, kalınlık 4–5 cm, nem ideal olmalı.','warn']);
  if(n.pin) t.push(['Şoklama koşulları tam sağlanamadı (16–19 °C, CO₂ < 1000 ppm, nem %85–93).','warn']);
  if(n.omix) t.push(['Substrat oranları hedef dışındaydı: nem %60–66, kepek %15–22, pH 6,5–7,5, azot %0,5–0,9.','warn']);
  if(n.ocam) t.push(['Çam talaşı reçine içerir; misel yavaş gelişti ve verim düştü. Kavak veya kayın talaşı kullanın.','warn']);
  if(n.oster) t.push(['Sterilizasyon/pastörizasyon yetersiz kaldı; torbalarda küf riski arttı.','bad']);
  if(n.obranpas) t.push(['Kepek oranı yüksekken yalnızca pastörizasyon yapıldı. Kepekli karışımı otoklavda sterilize edin.','warn']);
  if(n.oover) t.push(['Torbalar otoklavda gereğinden uzun kaldı; kepek karamelize oldu.','warn']);
  if(n.okill) t.push([`Torbalar sıcakken (${n.okill} °C) aşılandı ve misel zarar gördü. 30 °C'nin altına soğumasını bekleyin.`,'bad']);
  if(n.oheat) t.push(['Kuluçkada torba içi 30 °C\'yi aştı. Torbalar kendi ısısını üretir; odayı serin tutun.','bad']);
  if(n.ocontam) t.push([`Torbaların %${n.ocontam} kadarı yeşil küf nedeniyle kaybedildi. Bulaşık torbaları görür görmez ayıklayın.`,'warn']);
  if(n.oearly) t.push(['Kuluçkada ışık açıktı; torbaların içinde erken iğne başları oluştu.','warn']);
  if(n.opin) t.push(['Meyve koşulları tam sağlanamadı: günde 8–12 saat ışık, CO₂ < 1000 ppm, nem %85–95, türe uygun sıcaklık.','warn']);
  if(n.late) t.push([isO()?'Kümelerin yarısından fazlası şapka kenarları düzleştikten sonra toplandı. Daha erken toplayın.':'Mantarların yarısından fazlası zar açıldıktan sonra toplandı. Daha erken toplayın.','warn']);
  if(n.lost) t.push([`${n.lost} kg mantar toplanmadan çürüdü.`,'bad']);
  if(!t.length) t.push(['Kusursuz bir parti! Tüm aşamalar hedef değerlerde yürüdü.','ok']);
  return t; }

function fitScene(){ const box=scene.parentElement; const w=box.clientWidth||600, h=box.clientHeight||300;
  DPR=Math.min(2,window.devicePixelRatio||1);

const TEXC={};
function tex(key,w,h,draw){ w=Math.max(1,Math.round(w)); h=Math.max(1,Math.round(h)); const k=key+'|'+w+'x'+h+'|'+DPR; let c=TEXC[k]; if(c) return c;
  c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*DPR)); c.height=Math.max(1,Math.round(h*DPR)); const g=c.getContext('2d'); g.scale(DPR,DPR); draw(g,w,h); TEXC[k]=c;
  const ks=Object.keys(TEXC); if(ks.length>90) delete TEXC[ks[0]]; return c; }
function grain(g,w,h,base,specks,seed,fibers){ if(base){ g.fillStyle=base; g.fillRect(0,0,w,h); } const r=mulberry32(seed);
  for(const [col,dens,sz] of specks){ const n=Math.round(w*h*dens/100); g.fillStyle=col; for(let i=0;i<n;i++){ const q=sz*(0.4+r()); g.fillRect(r()*w,r()*h,q,q); } }

    B.stage='o_steril'; G.day++;
    log(`${fmt(m.talas,1)} t ${TALAS[m.type].name.toLocaleLowerCase('tr')}, ${fmt(m.kepek)} kg kepek, ${fmt(m.kirec)} kg kireç, ${fmt(m.alci)} kg alçı ve ${fmt(m.su,1)} m³ su karıştırıldı. ${fmt(s.bags)} torba dolduruldu (nem %${fmt(s.moist,1)}, pH ${fmt(s.pH,1)}).`);
    if(B.o.mixQ<0.8) log('Substrat oranları hedeflerin dışında; verim düşük olabilir.','bad'); },
  ometh(m){ B.o.st.method=m; log(m==='oto'?'Torbalar otoklava yüklendi.':'Torbalar buhar odasına (pastörizasyon) yüklendi.'); },
  ost(n){ const S=B.o.st, oto=S.method==='oto', bagF=Math.max(0.6,B.o.info.bags/3000);
    for(let i=0;i<n;i++){ if(S.min>=36*60) break;
      const maxT=oto?20+105*S.pow/100:20+80*S.pow/100;
      S.ch+=(maxT-S.ch)*0.4; S.core+=(S.ch-S.core)*0.22;
      const was=S.dose;
      if(oto){ if(S.core>=118) S.dose+=30; if(S.dose>240){ S.over+=30; if(S.over===30) log('Substrat gereğinden uzun pişiyor; kepek karamelize oluyor.','bad'); } }

  oekim(){ const e=B.o.ekim, st=OSTR[e.strain], s=B.o.info;

function oLayout(){ const bags=[],slots=[];
  for(let r=0;r<2;r++) for(let c=0;c<6;c++){ const cx=(c+0.5)/6, top=0.03+r*0.5, h=0.44; bags.push({cx,top,w:0.1,h});
    for(let j=0;j<3;j++) slots.push({x:cx+((j+c)%2?0.028:-0.028),y:top+h*(0.2+j*0.3)}); }
  return {bags,slots}; }

  if(s.dead){ ctx.fillStyle='#8A7650'; for(const [dx,dy] of [[-0.4,-0.2],[0.4,-0.25],[0,-0.5]]){ ctx.beginPath(); ctx.ellipse(x+dx*r,y+dy*r,r*0.6,r*0.35,dx,0,7); ctx.fill(); } return; }
  if(v<0.45){ const n=7, rr=r*(0.25+v*0.5); ctx.fillStyle=C[0];
    for(let i=0;i<n;i++){ ctx.beginPath(); ctx.arc(x+Math.cos(i*0.9)*rr*1.1,y+Math.sin(i*1.3)*rr*0.8,Math.max(1.5,rr*0.45),0,7); ctx.fill(); } return; }
  const caps=[[-0.55,-0.15,0.75],[0.55,-0.2,0.72],[0,-0.55,0.9],[-0.25,0.25,0.62],[0.3,0.22,0.58]];
  const ext=s.ls?1.45:1, color=v<0.75?C[0]:v<0.92?C[1]:C[2];

  for(const [dx,dy] of caps){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dx*r*ext*0.8,y+dy*r*ext*0.8); ctx.stroke(); }
  for(const [dx,dy,sc] of caps){ const cx=x+dx*r*ext, cy=y+dy*r*ext, rr=r*sc*(s.ls?0.75:1)*(0.55+0.45*Math.min(1,v)), ang=Math.atan2(dy,dx)+Math.PI/2;
    ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(cx+2,cy+3,rr,rr*0.68,ang,0,7); ctx.fill();
    const g=ctx.createRadialGradient(cx-rr*0.3,cy-rr*0.3,rr*0.1,cx,cy,rr); g.addColorStop(0,v<0.75?C[1]:C[2]); g.addColorStop(1,color);
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(cx,cy,rr,rr*0.68,ang,0,7); ctx.fill();
    if(v<0.75){ ctx.strokeStyle='rgba(40,40,45,.45)'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.ellipse(cx,cy,rr*0.92,rr*0.6,ang,0.2,Math.PI-0.2); ctx.stroke(); }
    if(v>=0.92){ ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.2; ctx.beginPath(); for(let a=0;a<=6.3;a+=0.35){ const w=1+0.08*Math.sin(a*6); const px=cx+Math.cos(a)*rr*w, py=cy+Math.sin(a)*rr*0.68*w; a===0?ctx.moveTo(px,py):ctx.lineTo(px,py);} ctx.stroke(); }
    if(s.bl){ ctx.fillStyle='rgba(176,140,50,.8)'; ctx.beginPath(); ctx.arc(cx+rr*0.2,cy,rr*0.18+1,0,7); ctx.fill(); }
    if(s.dry){ ctx.strokeStyle='rgba(60,50,40,.6)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(cx-rr*0.6,cy); ctx.lineTo(cx-rr*0.2,cy+rr*0.15); ctx.stroke(); } }
  if(v>=0.92){ ctx.fillStyle='rgba(245,243,238,.55)'; for(let i=0;i<10;i++){ const a=i*0.63+v*9; ctx.fillRect(x+Math.cos(a)*r*(1.4+0.3*Math.sin(i)),y+r*0.3+Math.sin(a)*r*0.9+(v-0.92)*30,1.6,1.6); } }
}
function drawBagShape(c,x,y,w,h,col,opts={}){

  const g=c.createLinearGradient(x,0,x+w,0); g.addColorStop(0,'rgba(0,0,0,.42)'); g.addColorStop(.28,'rgba(0,0,0,0)'); g.addColorStop(.5,'rgba(255,255,255,.07)'); g.addColorStop(.78,'rgba(0,0,0,.05)'); g.addColorStop(1,'rgba(0,0,0,.45)'); c.fillStyle=g; c.fillRect(x,y,w,h);
  c.restore();

}

    :'<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 2l9 5-9 5z" fill="currentColor"/></svg>Zamanı akıt'}</button><div class="speed" role="group" aria-label="Hız">${[1,2,4].map(v=>`<button data-act="speed:${v}" aria-pressed="${AUTO.speed===v}">${v}×</button>`).join('')}</div>${extra||''}</div>${hint?`<small class="desc opt">${hint}</small>`:''}`; }
let toastT=0;
function toast(msg){ const el=$('#toast'); el.innerHTML=`<b>Durdu:</b> ${msg}`; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{ el.hidden=true; },4200); }
let DRAG=false, PENDING=false;
function renderSoon(){ if(DRAG) PENDING=true; else render(); }
document.addEventListener('pointerdown',e=>{ if(e.target.matches&&e.target.matches('input[type=range]')) DRAG=true; });
document.addEventListener('pointerup',()=>{ if(DRAG){ DRAG=false; if(PENDING){ PENDING=false; render(); } } });
document.addEventListener('pointercancel',()=>{ DRAG=false; if(PENDING){ PENDING=false; render(); } });
function autoUpdate(dt){
  if(!AUTO.on) return;
  if(AUTO.stage!==B.stage){ AUTO.on=false; renderSoon(); return; }
  if(TOUR||sheet) return;
  const T=TICK[B.stage]; if(!T){ AUTO.on=false; return; }
  AUTO.acc+=dt; const iv=T.s/AUTO.speed; let n=0, why=null;
  while(AUTO.acc>=iv&&!why&&n<4){ AUTO.acc-=iv; AUTO.pause=null; why=T.step()||AUTO.pause; n++; if(B.stage!==AUTO.stage) why=why||'Aşama tamamlandı.'; }
  if(why){ AUTO.on=false; AUTO.acc=0; AUTO.pause=null; toast(why); }
  if(n){ save(); renderSoon(); if(B.stage!==AUTO.stage) setTimeout(maybeTip,150); }
}

/* ---------- tanıtım turu ve aşama ipuçları ---------- */
const PREF_KEY='mantarCiftligi.tercihler';
const PREF={tour:false,tips:{},tipsOff:false};
try{ Object.assign(PREF,JSON.parse(localStorage.getItem(PREF_KEY))||{}); }catch(e){}
function savePref(){ try{ localStorage.setItem(PREF_KEY,JSON.stringify(PREF)); }catch(e){} }
let TOUR=null;
function shown(sel){ const el=document.querySelector(sel); if(!el) return false; const r=el.getBoundingClientRect(); return r.width>0&&r.height>0; }
function tourSteps(){ const O=isO(); return [
  {t:'Mantar Çiftliği\'ne hoş geldiniz',x:'Gerçek bir mantar işletmesini yöneteceksiniz: substratı hazırlayıp miseli ekecek, odaların iklimini ayarlayacak, hasadı toplayıp satacaksınız. Bölümleri kısaca tanıyalım.'},
  {sel:'#steps',t:'Üretim aşamaları',x:'Soldaki menü üretimin aşamalarını sırayla gösterir. Turuncu olan şu an bulunduğunuz aşama; yeşil tikliler tamamlananlar. Aşamalar sırayla açılır.'},
  {sel:'#stats',t:'Kasa ve gün',x:'Kasa çiftliğin parasıdır. Hammadde, enerji ve işçilik her gün kasadan düşer; hasat satılınca para girer. Gün sayacı geçen süreyi gösterir.'},
  {sel:'.scenewrap',t:'Çiftlik görünümü',x:'Seçimlerinizin sonucunu burada canlı görürsünüz: yığından çıkan buhar, torbaları saran misel, küf lekeleri, sinekler. Hasatta mantarları buradan dokunarak toplarsınız.'},
  {sel:'#status',t:'Son olay',x:'En son olan şey burada yazar. Kırmızı satır bir sorun var demektir. Dokununca tüm olayların kaydı açılır.'},
  {sel:'#panel .seg',t:'Ne yetiştireceksiniz?',x:'Her partinin başında ürünü seçersiniz: talaş torbasında istiridye mantarı ya da kompostta beyaz şapkalı mantar. Aşamalar ürüne göre değişir.'},
  {sel:'#panel .ctls',t:'Kontroller',x:'Kaydırıcılarla miktarları ve oda koşullarını (sıcaklık, nem, taze hava, ışık) ayarlarsınız. Değer hemen yanında yazar.'},
  {sel:'#panel .gauges',t:'Göstergeler',x:'Çubuktaki yeşil bant hedef aralıktır. Kartın sol kenarı yeşilse değer hedefte, sarıysa yakın, kırmızıysa uzaktır.'},
  {sel:'#panel button.pri',t:'İşlem düğmesi',x:'Hazır olunca turuncu düğmeyle sonraki adıma geçersiniz. Günlük aşamalarda bu düğme zamanı ilerletir; her gün gider demektir.'},
  {sel:'[data-act="sheet:info"]',t:'Bilgi',x:'Her aşamanın gerçek üretimde nasıl yapıldığını buradan okuyun. Bu tanıtımı da buradan yeniden açabilirsiniz.'},
  {sel:'[data-act="sheet:log"]',t:'Çiftlik defteri',x:'Tüm olayların kaydı, kasa özeti ve yeni oyun başlatma burada.'},
  {t:'Hazırsınız',x:O?'İlk iş: talaş, kepek, kireç ve suyu ayarlayıp substratı hazırlayın. Her aşamaya ilk geldiğinizde kısa bir ipucu göreceksiniz.':'İlk iş: kompost karışımını hazırlayın. Her aşamaya ilk geldiğinizde kısa bir ipucu göreceksiniz.'},
].filter(st=>!st.sel||shown(st.sel)); }
const TIPS={
  karisim:'Göstergeleri yeşil banda getirin: azot %1,5–1,9, C/N 20–28, nem %70–77, jips %3–6. Sonra yığını kurun.',
  faz1:'Yığını 2–3 günde bir aktarın ki içi oksijensiz kalmasın. Olgunlaşma %80\'i geçince tünele taşıyabilirsiniz; %100 en iyisi.',
  faz2:'Önce 58–60 °C\'de 8 saat pastörize edin. Sonra 45–48 °C\'de taze havayla amonyağı 10 ppm\'in altına indirin.',
  ekim:'Misel hattını ve oranını seçin (%0,5–1). Hijyen önlemleri ilerideki küf ve sinek riskini azaltır.',
  kulucka:'Kompostu 24–27 °C\'de tutun. Misel ısındıkça oda sıcaklığını düşürün. Küf lekesi ya da sinek çıkarsa hemen müdahale edin.',
  ortu:'Örtü toprağını seçin ve ayarlayın: pH 7,2–7,9, kalınlık 4–5 cm, nem ideal.',
  caserun:'Misel örtüye yürürken sıcaklığı ve nemi koruyun. Yarı yolda örtüyü karıştırmak iğne başlarını düzenler.',
  sok:'Mantar oluşumu için odayı 16–18 °C\'ye soğutun, taze havayı açıp CO₂\'yi 1000 ppm\'in altına indirin.',
  hasat:'Flaşı başlatın ve mantarlara dokunarak toplayın. Açılmadan toplananlar A sınıfıdır; bekleyen mantar değer kaybeder.',
  rapor:'Sonuçları sekmelerden inceleyin. Kazancınızla çiftliğe yatırım yapıp yeni partiye başlayın.',
  o_karisim:'Göstergeleri yeşil banda getirin: nem %60–66, kepek %15–22, pH 6,5–7,5. Sonra karıştırıp torbalayın.',
  o_steril:'Yöntemi seçin ve torba merkezini izleyin: otoklavda 118 °C\'nin üstünde 90 dakika, buharda 65 °C\'nin üstünde 8 saat.',
  o_ekim:'Torbaların 30 °C\'nin altına soğumasını bekleyin. Sonra türü ve misel oranını (%3–5) seçip aşılayın.',
  o_kulucka:'Torba içini 22–27 °C\'de ve odayı karanlık tutun. Yeşil küflü torbaları gördüğünüz an ayıklayın.',
  o_meyve:'Önce torbaları açın. Sonra günde 8–12 saat ışık, bol taze hava (CO₂ < 1000 ppm) ve türe uygun sıcaklık sağlayın.',
};
function startTour(){ if(TOUR) return; sheet=null; render(); TOUR={kind:'tour',i:0,steps:tourSteps()}; drawTour(); }
function maybeTip(){ if(TOUR||sheet||PREF.tipsOff||!PREF.tour||PREF.tips[B.stage]||!TIPS[B.stage]) return;
  const STP=isO()?STEPS_O:STEPS, stp=STP.find(x=>x.st.includes(B.stage));
  TOUR={kind:'tip',i:0,stage:B.stage,steps:[{sel:B.stage==='hasat'?'.scenewrap':'#panel h2',t:stp?stp.name:'Bu aşama',x:TIPS[B.stage]}]}; drawTour(); }
function endTour(){ if(!TOUR) return; const k=TOUR.kind;
  if(k==='tour') PREF.tour=true; else PREF.tips[TOUR.stage]=true;
  savePref(); TOUR=null; const ov=$('#tour'); ov.hidden=true; ov.innerHTML='';
  if(k==='tour') setTimeout(maybeTip,250); }
function drawTour(){ const T=TOUR, st=T.steps[T.i], ov=$('#tour'), last=T.i===T.steps.length-1; ov.hidden=false;
  ov.innerHTML=`<div class="spot" id="spot" hidden></div><div class="bub" id="bub" role="dialog" aria-modal="true" aria-labelledby="bubt" aria-describedby="bubx">
   <div class="bub-k">${T.kind==='tour'?'Tanıtım':'Bu aşamada'}</div><h3 id="bubt">${st.t}</h3><p id="bubx">${st.x}</p>
   <div class="bub-f">${T.kind==='tour'
     ?`<button class="lnk" data-tour="skip">Atla</button><span class="sp"></span><span class="dots" aria-label="${T.i+1} / ${T.steps.length}">${T.steps.map((_,k)=>`<i class="${k===T.i?'on':''}"></i>`).join('')}</span><span class="sp"></span>${T.i>0?'<button data-tour="prev">Geri</button>':''}<button class="pri" data-tour="next" id="tnext">${last?'Başlayalım':'İleri'}</button>`
     :`<button class="lnk" data-tour="off">İpuçlarını kapat</button><span class="sp"></span><button class="pri" data-tour="next" id="tnext">Anladım</button>`}</div></div>`;
  placeTour(); const b=$('#tnext'); if(b) b.focus({preventScroll:true}); }
function placeTour(){ if(!TOUR) return; const st=TOUR.steps[TOUR.i], spot=$('#spot'), bub=$('#bub'), ov=$('#tour'); if(!bub) return;
  const vw=innerWidth, vh=innerHeight, M=12, bw=Math.min(340,vw-2*M); bub.style.width=bw+'px';
  const el=st.sel&&document.querySelector(st.sel); if(el&&el.scrollIntoView) el.scrollIntoView({block:'nearest'});
  const r=el?el.getBoundingClientRect():null, bh=bub.offsetHeight;
  if(!r||!r.width){ spot.hidden=true; ov.classList.add('dim'); bub.style.left=(vw-bw)/2+'px'; bub.style.top=Math.max(M,(vh-bh)/2)+'px'; return; }
  ov.classList.remove('dim');
  const pad=5, sx=Math.max(3,r.left-pad), sy=Math.max(3,r.top-pad), sw=Math.min(vw-3,r.right+pad)-sx, sh=Math.min(vh-3,r.bottom+pad)-sy;
  spot.hidden=false; Object.assign(spot.style,{left:sx+'px',top:sy+'px',width:sw+'px',height:sh+'px'});
  let x,y;
  if(vh-(sy+sh)>=bh+M*2){ y=sy+sh+M; x=sx+sw/2-bw/2; }
  else if(sy>=bh+M*2){ y=sy-bh-M; x=sx+sw/2-bw/2; }
  else if(vw-(sx+sw)>=bw+M*2){ x=sx+sw+M; y=sy+sh/2-bh/2; }
  else if(sx>=bw+M*2){ x=sx-bw-M; y=sy+sh/2-bh/2; }
  else if(vw-(sx+sw)>=200+M*2){ const w2=vw-(sx+sw)-M*2; bub.style.width=w2+'px'; const h2=bub.offsetHeight; x=sx+sw+M; y=Math.max(sy,M)+Math.min(sh,vh)/2-h2/2; bub.style.left=x+'px'; bub.style.top=clamp(y,M,Math.max(M,vh-h2-M))+'px'; return; }
  else { x=(vw-bw)/2; y=vh-bh-M; }
  bub.style.left=clamp(x,M,vw-bw-M)+'px'; bub.style.top=clamp(y,M,Math.max(M,vh-bh-M))+'px'; }
function tourAct(a){ if(!TOUR) return;
  if(a==='next'){ if(TOUR.i<TOUR.steps.length-1){ TOUR.i++; drawTour(); } else endTour(); }
  else if(a==='prev'){ if(TOUR.i>0){ TOUR.i--; drawTour(); } }
  else if(a==='skip') endTour();
  else if(a==='off'){ PREF.tipsOff=true; endTour(); } }
document.getElementById('tour').addEventListener('click',e=>{ const b=e.target.closest('[data-tour]'); if(b) tourAct(b.dataset.tour); });
window.addEventListener('resize',()=>{ if(TOUR) placeTour(); });

const COMPACT=['karisim','o_karisim','ekim','o_ekim','ortu','rapor'];
function render(){
  const act=document.activeElement&&document.activeElement.id;
  const pnl=$('#panel'), keepScroll=pnl.dataset.stage===B.stage?pnl.scrollTop:0;
  const st=STAGES[B.stage]; BIND={};
  if(AUTO.on&&AUTO.stage!==B.stage) AUTO.on=false;
  const app=$('#app'); app.dataset.stage=B.stage; if(COMPACT.includes(B.stage)) app.dataset.compact=''; else delete app.dataset.compact;
  $('#stats').innerHTML=`<div class="stat"><span>Kasa</span><b class="${G.money<0?'neg':''}">${tl(G.money)}</b></div><div class="stat"><span>Gün</span><b>${G.day}</b></div><div class="stat opt"><span>Parti</span><b>${G.batchNo}</b></div>${G.best!==null?`<div class="stat opt"><span>En iyi kâr</span><b>${tl(G.best)}</b></div>`:''}`;
  const STP=isO()?STEPS_O:STEPS; const idx=STP.findIndex(s=>s.st.includes(B.stage));
  $('#steps').innerHTML=STP.map((s,i)=>`<div class="st ${i<idx?'done':i===idx?'cur':''}" ${i===idx?'aria-current="step"':''}><span class="num">${i<idx?'✓':i+1}</span><span class="nm"><span class="full">${s.name}</span><span class="kisa">${s.kisa||s.name}</span></span><span class="sb">${s.sub}</span></div>`).join('');
  const cur=$('#steps .cur'); if(cur&&cur.scrollIntoView) cur.scrollIntoView({block:'nearest'});
  const info=typeof st.info==='function'?st.info():st.info;
  $('#info').innerHTML=`<h3>Gerçek üretimde</h3><p>${info}</p>`;
  pnl.innerHTML=st.panel(); pnl.dataset.stage=B.stage; pnl.scrollTop=keepScroll;
  const L=$('#live'); if(L&&st.live) L.innerHTML=st.live();
  $('#sceneCap').textContent=st.cap();
  const last=B.log[0]; const sb=$('#status'); sb.className='status '+(last?last.kind:''); sb.innerHTML=last?`<span>Gün ${last.d}</span><em>${last.msg}</em>`:'<em>Çiftlik defteri</em>';
  const sh=$('#sheet');
  if(sheet){ sh.hidden=false;
    sh.innerHTML=sheet==='info'
      ?`<div class="sheet-card" role="dialog" aria-modal="true" aria-label="Bilgi"><div class="sheet-h"><h2>${(STP[idx]||{}).name||'Bilgi'}</h2><button data-act="shut" id="shutbtn">Kapat</button></div><div class="sheet-b"><h3 class="k">Gerçek üretimde</h3><p>${info}</p><h3 class="k">Nasıl oynanır</h3><p>Sağdaki kaydırıcılarla koşulları ayarlayın, sonra günü ilerletin. Göstergelerdeki yeşil bant hedef aralıktır; kenardaki renk yeşilse değer hedefte, sarıysa yakın, kırmızıysa uzaktır. Soldaki menü hangi aşamada olduğunuzu gösterir.</p><div class="btns"><button data-act="tour">Tanıtımı yeniden göster</button><button data-act="tips" aria-pressed="${!PREF.tipsOff}">Aşama ipuçları: ${PREF.tipsOff?'Kapalı':'Açık'}</button></div></div></div>`
      :`<div class="sheet-card" role="dialog" aria-modal="true" aria-label="Çiftlik defteri"><div class="sheet-h"><h2>Çiftlik defteri</h2><button data-act="shut" id="shutbtn">Kapat</button></div><div class="sheet-b"><div class="kv"><span>Parti</span><span>${G.batchNo}</span><span>Kasa</span><span>${tl(G.money)}</span>${G.best!==null?`<span>En iyi parti kârı</span><span>${tl(G.best)}</span>`:''}</div><ol id="log">${B.log.map(l=>`<li class="${l.kind}"><span>Gün ${l.d}</span>${l.msg}</li>`).join('')}</ol><div class="btns">${confirmReset?`<button class="danger" data-act="reset:ok">Evet, her şeyi sıfırla</button><button data-act="resetno">Vazgeç</button>`:`<button class="danger" data-act="reset">Yeni oyun başlat</button>`}</div></div></div>`;
  } else { sh.hidden=true; sh.innerHTML=''; }
  if(act){ const el=document.getElementById(act); if(el) el.focus({preventScroll:true}); }
  else if(sheet){ const b=$('#shutbtn'); if(b) b.focus({preventScroll:true}); }
}
document.addEventListener('click',e=>{ if(e.target.id==='sheet'){ sheet=null; confirmReset=false; render(); return; } const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const [a,arg]=b.dataset.act.split(':'); const fn=ACT[a]; if(!fn) return;
  fn(arg!==undefined&&!isNaN(+arg)?+arg:arg); save(); render(); setTimeout(maybeTip,120); });
document.addEventListener('input',e=>{ const el=e.target; const bd=BIND[el.id];
  if(bd){ const v=+el.value; bd.set(v); const o=document.getElementById(el.id+'-o'); if(o) o.textContent=bd.show(v)+(bd.unit?' '+bd.unit:'');
    const L=$('#live'), st=STAGES[B.stage]; if(L&&st.live&&B.stage!=='hasat') L.innerHTML=st.live(); save(); return; }
  const k=el.dataset.bind; if(!k) return;
  const v=+el.value;
  if(k==='strain') B.ekim.strain=v; else if(k==='cas') B.ortu.type=v; else if(k==='talas') B.o.mix.type=v; else if(k==='ostrain') B.o.ekim.strain=v;
  else if(isO()) B.o.ekim[k]=el.checked; else B.ekim[k]=el.checked;
  save(); render(); });
document.addEventListener('keydown',e=>{ if(TOUR){ if(e.key==='Escape') tourAct(TOUR.kind==='tour'?'skip':'next'); else if(e.key==='ArrowRight') tourAct('next'); else if(e.key==='ArrowLeft') tourAct('prev'); return; } if(e.key==='Escape'&&sheet){ sheet=null; confirmReset=false; render(); } });
scene.addEventListener('pointerdown',e=>{ if(B.stage!=='hasat') return; const r=scene.getBoundingClientRect(); pickAt(e.clientX-r.left,e.clientY-r.top); });

function boot(data){
  G=(data&&data.G)||load()||newGame(); B=G.B; if(!B.sp) B.sp='a'; if(!G.lastSp) G.lastSp=B.sp;
  if(B.stage==='hasat'&&B.h&&B.h.phase==='running') B.h.phase=B.h.flush===0?'ready':'between';
  if(B.h&&B.h.phase==='between'&&!B.h.last) B.h.last={A:0,B:0,C:0,lost:0};
  if(!B.log.length) log('Çiftliğe hoş geldiniz. Kasada 250.000 ₺ var. İlk iş: ne yetiştireceğinizi seçip substratı hazırlayın.');
  render(); requestAnimationFrame(frame);
  setTimeout(()=>{ if(!PREF.tour) startTour(); else maybeTip(); },450);
}
window.claude?.hot?.snapshot?.(()=>({G}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
